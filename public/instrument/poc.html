<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cabinet POC, Eduardo de Souza</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f1eee8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1e20'/%3E%3Crect x='5' y='15' width='22' height='2' fill='%23e5470e'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* Paint the saved theme before first paint, exactly as index.html does. */
    try {
      var saved = JSON.parse(localStorage.getItem('instrument-theme'));
      if (saved && saved.css) { document.documentElement.style.cssText = saved.css; document.documentElement.dataset.theme = saved.name; }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/poc.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/poc.js"></script>
</head>
<!-- Cabinet POC: one cabinet driven by theme data, switching live. See docs/cabinet-poc/. -->
<body data-view="home" class="poc">
  <div id="stage" aria-hidden="true"></div>

  <header class="bar">
    <a class="bar-name mono" href="./">Eduardo de Souza</a>
    <div id="theme-switch" class="theme-switch" role="radiogroup" aria-labelledby="theme-switch-label" hidden></div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <!-- [TODO] Placeholder headline. Eduardo owns the final copy. -->
        <h1 id="hero-title" class="hero-title">Ideas into Play</h1>
      </div>
      <div id="machine-slot" class="machine-slot"></div>
      <div class="hero-actions">
        <button id="spin" class="spin" type="button" aria-describedby="spin-note">
          <span class="spin-knob" aria-hidden="true"></span>
          <span class="spin-label">Pull the lever</span>
        </button>
        <p id="spin-note" class="note mono">A UI metaphor, not a casino. No real money.</p>
      </div>
    </section>
  </main>

  <aside id="dev" class="dev mono" aria-label="Dev panel" hidden></aside>
  <p id="announcer" class="sr-only" aria-live="polite"></p>
  <noscript><p class="noscript">This page needs JavaScript and WebGL.</p></noscript>
</body>
</html>
